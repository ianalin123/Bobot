[project]
name = "bob-robot"
version = "0.1.0"
description = "Local-first companion robot runtime and hardware-free workbench"
requires-python = ">=3.11,<3.14"
dependencies = [
  "anyio>=4,<5",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "faster-whisper>=1.1,<2",
  "numpy>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "websockets>=14,<16", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
