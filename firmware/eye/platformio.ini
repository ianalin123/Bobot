; Bob's eye: Waveshare ESP32-S3-Touch-LCD-1.85 (ST77916 360x360 QSPI round LCD).
; Toolchain: pioarduino (arduino-esp32 3.x). Pin map and init sequence come from the Waveshare
; wiki and the Arduino_GFX ST77916 driver; they have NOT been verified on hardware yet.
[env:eye]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags = -DBOARD_HAS_PSRAM -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = moononournation/GFX Library for Arduino@^1.6.7, bblanchon/ArduinoJson@^7
monitor_speed = 115200
upload_speed = 921600
