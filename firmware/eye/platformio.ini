; Bob's eye: Waveshare ESP32-S3-Touch-LCD-2.1 (ST7701 480x480 round LCD, 16-bit RGB parallel).
; Toolchain: pioarduino (arduino-esp32 3.x). Pin map, timings and init table come from the Waveshare
; wiki and the ESP32_Display_Panel board file; see README.md for what is still unverified on hardware.
[env:eye]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags = -DBOARD_HAS_PSRAM -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = moononournation/GFX Library for Arduino@^1.6.7, bblanchon/ArduinoJson@^7
monitor_speed = 115200
upload_speed = 921600
