name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --locked --python 3.12
      - run: uv run pytest -q
      - run: node --test web/*.test.mjs
      - run: uv run ruff check bob tests scripts
      - run: uv run ruff format --check bob tests scripts
